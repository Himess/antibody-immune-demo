name: immune memory

# Every pull request re-runs the paid proofs of Acme Lend's program (near-antibody testnet, program 5) that
# this run can read against the contracts it builds, and fails if one still breaks a committed rule.
on:
  pull_request:   # never pull_request_target: it would run the pull request's code with this repository's secrets
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  immune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action and the antibody binary it downloads are pinned to the same release.
      - uses: Himess/antibody/.github/actions/immune-memory@v0.5.0
        with:
          version: v0.5.0
          program: "5"
          # Optional: reads paid findings wrapped to the project. GitHub never gives it to pull requests from forks.
          project-key: ${{ secrets.ANTIBODY_PROJECT_KEY }}
