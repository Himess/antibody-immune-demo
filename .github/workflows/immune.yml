name: immune memory

# Every pull request is checked two ways against Acme Lend's paid proofs (Antibody's docs/immune.md):
# - `immune`: the paid proofs of program 5 this run can read are re-run here, on the runner, against the
#   contracts this repository builds.
# - `round` and `enclave`: the pull request's build is proposed as the next round of program 12, kept for
#   pull-request checks, and every paid proof of that program is re-run inside the enclave through
#   near-antibody's rounds; only which keys still break is published. Pull requests from forks get no
#   secret, so they run `immune` only.
on:
  pull_request:   # never pull_request_target: it would run the pull request's code with this repository's secrets
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  immune:
    # Green here means only that no readable proof breaks: sealed proofs are the enclave check's.
    name: "runner (advisory): readable proofs only; sealed ones are the enclave check's"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The action is pinned by commit (the v0.6.3 tag's), and the binary it downloads to the same release.
      - uses: Himess/antibody/.github/actions/immune-memory@6f5d1daa3f8b89ceadcbc08164e94ec32619114f # v0.6.3
        with:
          version: v0.6.3
          program: "5"
          # No key here: this job builds the pull request's code (a project key would belong in a job that runs none of it).

  round:          # the pull request's code is built here, with no secret
    name: "round: propose this build (no verdict)"
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Himess/antibody/.github/actions/immune-memory@6f5d1daa3f8b89ceadcbc08164e94ec32619114f # v0.6.3
        with:
          version: v0.6.3
          program: "12"
          manifest-out: round.json
          # This step only writes the round manifest; the enclave job gives the verdict.
          fail-on-inconclusive: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: round-manifest
          path: round.json
          if-no-files-found: error

  enclave:        # the scoped keys are here, and nothing from the pull request runs
    name: "enclave: every paid proof (the verdict)"
    needs: round
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: antibody-program-12   # one proposal at a time per program
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: round-manifest
          path: ${{ runner.temp }}/round   # its own folder: the action takes the manifest as one regular file
      - uses: Himess/antibody/.github/actions/immune-enclave@6f5d1daa3f8b89ceadcbc08164e94ec32619114f # v0.6.3
        with:
          version: v0.6.3
          program: "12"
          manifest: ${{ runner.temp }}/round/round.json
          project-account: acme.antibody.testnet
          project-key: ${{ secrets.ANTIBODY_PROPOSE_KEY }}
          bot-account: keeper.antibody.testnet
          bot-key: ${{ secrets.ANTIBODY_BOT_KEY }}

  enclave-fork:   # a fork's pull request gets no secret: a failing notice, not a skipped (green) check
    name: "enclave, for a fork's pull request: not checked"
    needs: round
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "::error title=Antibody immune memory::not checked in the enclave: a pull request from a fork gets no secret. A maintainer re-runs the check from a branch of this repository."
          exit 1
